# Render Blueprint for the TalkLink API. In Render: New -> Blueprint -> pick this repo.
# It creates the web service and a Redis (Key Value) instance. Values marked `sync: false` are
# asked for in the Render dashboard (fill them now or later - the server starts without them and
# logs which features are off). Full list: .env.example and README.md.
services:
  - type: web
    name: talklink-api
    runtime: node
    region: singapore # closest Render region to India
    plan: starter # free instances sleep after 15 min idle -> calls / sockets drop
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: TRUST_PROXY
        value: '1'
      - key: DEV_OTP_BYPASS
        value: 'false'
      # databases
      - key: MONGO_URI
        sync: false # MongoDB Atlas connection string (replica set, e.g. mongodb+srv://...)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: talklink-redis
          property: connectionString
      # login tokens - Render generates long random values
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # email OTP (needed to log in on a production server)
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      # calls across different networks
      - key: TURN_HOST
        sync: false
      - key: TURN_SECRET
        sync: false
      # push (incoming calls while the app is closed) - base64 of the service-account JSON
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # payments
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      - key: CASHFREE_ENV
        value: sandbox
      # rewarded ads
      - key: ADMOB_SSV_ENABLED
        value: 'true'
      - key: ADMOB_AD_UNIT_IDS
        sync: false
      # support / monitoring
      - key: SUPPORT_EMAIL
        sync: false
      - key: FEEDBACK_TO_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ADMIN_API_KEY
        sync: false

  - type: keyvalue
    name: talklink-redis
    region: singapore
    plan: starter # free Key Value has no persistence; locks / counters are fine either way
    maxmemoryPolicy: noeviction
    ipAllowList: [] # only reachable from Render services in this account
