# Backend CI: lint + secret scan + tests on every push / PR. Render deploys by itself from GitHub
# (autoDeploy in render.yaml), so there is no deploy step here.
name: Backend CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/talklink_test?replicaSet=rs0&directConnection=true
      TEST_REDIS_URL: redis://127.0.0.1:6380/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # MongoDB must be a replica set (transactions)
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }" && break
            sleep 2
          done
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm run test:coverage
